name: Qwen Full Korean Male Narration

on:
  push:
    branches: [main]
    paths:
      - "scripts/qwen_full_group.py"
      - ".github/workflows/qwen-full-voice.yml"
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 1
            end: 5
            label: 01-05
          - start: 6
            end: 10
            label: 06-10
          - start: 11
            end: 15
            label: 11-15
          - start: 16
            end: 20
            label: 16-20
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qwen-tts>=0.0.5" soundfile numpy torch

      - name: Generate narration group
        env:
          START_SCENE: ${{ matrix.start }}
          END_SCENE: ${{ matrix.end }}
        run: python scripts/qwen_full_group.py

      - name: Upload narration group
        uses: actions/upload-artifact@v4
        with:
          name: qwen-korean-male-${{ matrix.label }}
          path: build/qwen_full/*
          if-no-files-found: error
          retention-days: 7
