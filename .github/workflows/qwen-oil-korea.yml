name: Qwen Oil Korea Narration

on:
  push:
    branches: [main]
    paths:
      - "scripts/qwen_oil_korea_narration.py"
      - ".github/workflows/qwen-oil-korea.yml"
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - start: 1
            end: 2
            label: 01-02
          - start: 3
            end: 4
            label: 03-04
          - start: 5
            end: 6
            label: 05-06
          - start: 7
            end: 8
            label: 07-08
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qwen-tts>=0.0.5" soundfile numpy torch

      - name: Generate narration
        env:
          START_SCENE: ${{ matrix.start }}
          END_SCENE: ${{ matrix.end }}
        run: python scripts/qwen_oil_korea_narration.py

      - name: Upload narration
        uses: actions/upload-artifact@v4
        with:
          name: qwen-oil-korea-${{ matrix.label }}
          path: build/qwen_oil_korea/*
          if-no-files-found: error
          retention-days: 7
