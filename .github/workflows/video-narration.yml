name: Generate Narration Video

on:
  push:
    branches: [main]
    paths:
      - "video/scenes.json"
      - "scripts/build_history_video.py"
      - ".github/workflows/video-narration.yml"
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install edge-tts pillow

      - name: Fix Edge TTS rate argument
        run: sed -i "s/'--rate','-5%'/'--rate=-5%'/g" scripts/build_history_video.py

      - name: Build 20-scene history video
        run: python scripts/build_history_video.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: island-korea-11min-video
          path: |
            build/final.mp4
            build/thumbnail.png
            build/duration.txt
          if-no-files-found: error
          retention-days: 7
