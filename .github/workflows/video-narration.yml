name: Generate Narration Video

on:
  push:
    branches: [main]
    paths:
      - "video/scenes.json"
      - "video/asset_queries.json"
      - "scripts/build_docu_pro.py"
      - ".github/workflows/video-narration.yml"
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: pip install edge-tts pillow requests

      - name: Build premium 1080p documentary
        run: python scripts/build_docu_pro.py

      - name: Upload finished documentary
        uses: actions/upload-artifact@v4
        with:
          name: island-korea-documentary-pro
          path: |
            build/final.mp4
            build/thumbnail.png
            build/duration.txt
            build/credits.txt
            build/credits.json
          if-no-files-found: error
          retention-days: 7
