name: Qwen Oil Korea 60 Scene Fast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qwen-oil-korea-60scene-fast.yml"
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {name: "01-05", start: 1, end: 5}
          - {name: "06-10", start: 6, end: 10}
          - {name: "11-15", start: 11, end: 15}
          - {name: "16-20", start: 16, end: 20}
          - {name: "21-25", start: 21, end: 25}
          - {name: "26-30", start: 26, end: 30}
          - {name: "31-35", start: 31, end: 35}
          - {name: "36-40", start: 36, end: 40}
          - {name: "41-45", start: 41, end: 45}
          - {name: "46-50", start: 46, end: 50}
          - {name: "51-55", start: 51, end: 55}
          - {name: "56-60", start: 56, end: 60}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qwen-tts>=0.0.5" soundfile numpy torch
      - name: Generate narration
        env:
          START_SCENE: ${{ matrix.start }}
          END_SCENE: ${{ matrix.end }}
        run: python scripts/qwen_oil_korea_60scene_voice.py
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-oil-korea-fast-${{ matrix.name }}
          path: build/qwen_oil_korea_60scene/*
          retention-days: 7
