name: Qwen Reference Style Fast

on:
  push:
    branches: [main]
    paths:
      - "scripts/qwen_reference_style_speaker_fast.py"
      - ".github/workflows/qwen-reference-style-fast.yml"
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        speaker: [Ryan, Dylan, Eric]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qwen-tts>=0.0.5" soundfile numpy torch
      - name: Generate
        env:
          SPEAKER: ${{ matrix.speaker }}
        run: python scripts/qwen_reference_style_speaker_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: qwen-ref-fast-${{ matrix.speaker }}
          path: build/qwen_reference_style_fast/*
          if-no-files-found: error
          retention-days: 7
