name: Qwen Reference Style Speaker Test

on:
  push:
    branches: [main]
    paths:
      - "scripts/qwen_reference_style_speaker_test.py"
      - ".github/workflows/qwen-reference-style-speaker-test.yml"
  workflow_dispatch:

jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        speaker: [Ryan, Dylan, Eric]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "qwen-tts>=0.0.5" soundfile numpy torch

      - name: Generate speaker test
        env:
          SPEAKER: ${{ matrix.speaker }}
        run: python scripts/qwen_reference_style_speaker_test.py

      - name: Upload speaker test
        uses: actions/upload-artifact@v4
        with:
          name: qwen-ref-${{ matrix.speaker }}
          path: build/qwen_reference_style_speakers/*
          if-no-files-found: error
          retention-days: 7
